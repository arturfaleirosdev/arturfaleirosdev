name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=nightowl&include_all_commits=true&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.PAT }}

      - name: Top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=nightowl&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.PAT }}

      - name: Commit cards
        run: |
          set -e
          BRANCH=${{ github.ref_name }}
          echo "=== VERSAO NOVA DO SCRIPT ==="

          mkdir -p /tmp/cards
          cp profile/*.svg /tmp/cards/

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"

          mkdir -p profile
          cp /tmp/cards/*.svg profile/
          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "Nenhuma mudanca nos cards."
            exit 0
          fi

          git commit -m "Update README cards"
          git push --force-with-lease origin "HEAD:$BRANCH"
